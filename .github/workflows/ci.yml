name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify Docker Build (Backend & Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose Build
        env:
          FRONTEND_TARGET: production
        run: |
          echo "=========================================================="
          echo "🔍 Verifying Docker build for Backend & Frontend..."
          echo "=========================================================="
          docker compose build backend frontend
          echo "✅ Build verified successfully! Both Backend & Frontend build cleanly."

  build-and-push-ghcr:
    name: Build & Push Images to GHCR
    needs: [verify-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push to GHCR
        run: |
          # Format nama repository agar huruf kecil (persyaratan standar Docker Registry)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          export BACKEND_IMAGE="ghcr.io/${REPO_LOWER}/backend:latest"
          export FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}/frontend:latest"
          export FRONTEND_TARGET="production"
          
          echo "=========================================================="
          echo "🚀 Building production images with Docker Compose..."
          echo "=========================================================="
          docker compose build backend frontend
          
          echo "=========================================================="
          echo "📦 Pushing images to GHCR..."
          echo "=========================================================="
          docker compose push backend frontend
          
          # Beri tag tambahan menggunakan Commit SHA untuk pelacakan rilis
          docker tag "$BACKEND_IMAGE" "ghcr.io/${REPO_LOWER}/backend:${{ github.sha }}"
          docker tag "$FRONTEND_IMAGE" "ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }}"
          docker push "ghcr.io/${REPO_LOWER}/backend:${{ github.sha }}"
          docker push "ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }}"
          
          echo "✅ Successfully published both backend and frontend images to GHCR!"
